<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#151923" />

    <title>Dino Run - Meteor Escape</title>

    <link rel="stylesheet" href="css/style.css" />
    <script src="js/game.js" defer></script>
  </head>
  <body>
    <main class="container">
      <header class="header">
        <a href="#" class="brand">
          <div class="brand-icon">D</div>
          <div>
            <h1>DINO RUN</h1>
            <span>METEOR ESCAPE</span>
          </div>
        </a>

        <div class="score-board">
          <div class="score-item">
            <span>SCORE</span>
            <strong id="score">00000</strong>
          </div>

          <div class="score-item">
            <span>BEST</span>
            <strong id="best">00000</strong>
          </div>
        </div>
      </header>

      <section class="game-panel">
        <div class="game-heading">
          <span class="game-label">EXTINCTION RUN</span>
          <span class="game-status" id="status">READY</span>
        </div>

        <div class="canvas-wrapper">
          <canvas
            id="gameCanvas"
            width="900"
            height="360"
            aria-label="Dinosaurus menghindari meteor"
          ></canvas>

          <div class="overlay" id="overlay">
            <div class="overlay-content">
              <span class="overlay-label" id="overlayLabel">
                WARNING: METEOR SHOWER
              </span>

              <h2 id="overlayTitle">RUN, DINO!</h2>

              <p id="overlayDescription">
                Hujan meteor telah dimulai. Bantu dinosaurus bertahan sejauh
                mungkin.
              </p>

              <button id="startButton">START GAME</button>
            </div>
          </div>
        </div>

        <div class="game-controls">
          <div class="control-keys">
            <span class="key">SPACE</span>
            <span class="key">↑</span>
            <span class="control-text">JUMP</span>
          </div>

          <span class="control-info"> Press space or tap to jump </span>
        </div>
      </section>

      <footer class="footer">
        <span>DINO RUN: METEOR ESCAPE</span>
        <span>ENDLESS RUNNER</span>
      </footer>
    </main>
  </body>
</html>
